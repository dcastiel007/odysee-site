<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Odysee — Coming soon</title>
<meta name="description" content="Odysee — Your Personal Travel Companion. Coming soon.">
<!-- Temporary holding page. Keep this off search engines while the site is being finished. -->
<meta name="robots" content="noindex, nofollow">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap" rel="stylesheet">

<style>
  :root{
    /* Brand V5 — hardcoded so this page has zero external dependencies */
    --navy:        #1D3D60;
    --navy-ink:    #12273E;
    --navy-muted:  #3A5D83;
    --navy-faint:  #8499B3;
    --orange:      #E5763C;
    --sand-50:     #FAF6F0;
    --sand-200:    #E9E0D2;
    --font:        "Sora", system-ui, -apple-system, sans-serif;
    --dur-idle:    4s;
  }

  *{ box-sizing: border-box; margin: 0; padding: 0; }

  html, body{ height: 100%; }

  body{
    font-family: var(--font);
    background: var(--sand-50);
    color: var(--navy-ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 32px;
    -webkit-font-smoothing: antialiased;
  }

  .wrap{
    display: flex;
    flex-direction: column;
    align-items: center;
    max-width: 640px;
  }

  /* ── Tico mark ─────────────────────────────────────────── */
  .mark{
    width: clamp(112px, 22vw, 164px);
    height: auto;
    display: block;
    transform-origin: center;
    animation: breathe var(--dur-idle) ease-in-out infinite;
  }
  .mark .ring     { stroke: var(--navy); }
  .mark .cap-end  { fill: var(--orange); }

  @keyframes breathe{
    0%, 100% { transform: scale(1);    }
    50%      { transform: scale(1.045); }
  }

  /* ── Wordmark + text ───────────────────────────────────── */
  .wordmark{
    font-weight: 800;
    font-size: clamp(40px, 9vw, 66px);
    letter-spacing: -0.035em;
    color: var(--navy-ink);
    margin-top: 30px;
    line-height: 1;
  }

  .tagline{
    margin-top: 16px;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--navy-muted);
  }

  .status{
    margin-top: 44px;
    font-size: 16px;
    font-weight: 400;
    color: var(--navy-muted);
    letter-spacing: 0.01em;
  }
  .status .dot{
    display: inline-block;
    width: 6px; height: 6px;
    margin-left: 3px;
    border-radius: 50%;
    background: var(--orange);
    vertical-align: middle;
    animation: blink 1.6s ease-in-out infinite;
  }
  @keyframes blink{
    0%, 100% { opacity: 0.35; }
    50%      { opacity: 1; }
  }

  .foot{
    position: fixed;
    bottom: 24px;
    left: 0; right: 0;
    font-size: 12px;
    letter-spacing: 0.04em;
    color: var(--navy-faint);
  }

  @media (prefers-reduced-motion: reduce){
    .mark, .status .dot{ animation: none; }
  }
</style>
</head>
<body>
  <main class="wrap">
    <!-- Tico mark — the O of Odysee -->
    <svg class="mark" viewBox="0 0 1000 1000" aria-label="Odysee" role="img" fill="none">
      <path class="ring" fill="none" stroke-width="50" stroke-linecap="round" stroke-linejoin="round" d="M 941.072449 422.659241 C 932.16748 320.875366 831.286194 246.557617 715.747742 256.665955 C 600.20929 266.774231 513.765747 357.480774 522.670654 459.264648 C 531.575623 561.048523 632.456909 635.366272 747.995361 625.257935 C 863.533813 615.149658 949.977356 524.443115 941.072449 422.659241 Z"/>
      <path class="ring" fill="none" stroke-width="50" stroke-linecap="round" stroke-linejoin="round" d="M 478.329315 459.264648 C 487.234253 357.480774 400.79071 266.774231 285.252258 256.665955 C 169.713791 246.557617 68.832489 320.875366 59.927555 422.659241 C 51.022621 524.443115 137.466171 615.149658 253.004623 625.257935 C 368.543091 635.366272 469.424408 561.048523 478.329315 459.264648 Z"/>
      <path class="ring" fill="none" stroke-width="50" stroke-linecap="round" stroke-linejoin="round" d="M 900 500 C 900 279.086121 720.913879 100 500 100 C 279.086121 100 100 279.086121 100 500 C 100 720.913879 279.086121 900 500 900 C 720.913879 900 900 720.913879 900 500 Z"/>
      <circle class="cap-end" cx="725" cy="399" r="48"/>
      <circle class="cap-end" cx="300" cy="399" r="48"/>
    </svg>

    <div class="wordmark">Odysee</div>
    <div class="tagline">Your Personal Travel Companion</div>

    <p class="status">Coming soon<span class="dot" aria-hidden="true"></span></p>
  </main>

  <footer class="foot">odysee.me</footer>
</body>
</html>
